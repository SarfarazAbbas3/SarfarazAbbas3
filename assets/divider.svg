<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#line)"/>
  <circle cy="12" r="10" fill="url(#dot)">
    <animate attributeName="cx" values="0;1200" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <rect x="592" y="6" width="16" height="12" rx="3" fill="#0d1117" stroke="#38bdf8" stroke-opacity="0.7" transform="rotate(45 600 12)">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
