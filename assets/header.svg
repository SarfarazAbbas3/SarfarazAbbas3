<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sarfaraz Abbas - Cyber Security Researcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0b1a2e"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typeclip">
      <rect x="0" y="0" height="320" width="0">
        <animate attributeName="width" values="0;1200;1200;0" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- ambient glows -->
  <circle cx="1020" cy="110" r="190" fill="url(#glow)">
    <animate attributeName="r" values="170;215;170" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="260" r="140" fill="url(#glow)" opacity="0.6">
    <animate attributeName="r" values="120;165;120" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- scanning line -->
  <rect x="0" y="-60" width="1200" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;320" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- floating particles -->
  <g fill="#38bdf8">
    <circle cx="120" cy="70" r="2"><animate attributeName="cy" values="70;40;70" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="250" r="2"><animate attributeName="cy" values="250;220;250" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.2;0.9" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="60" r="1.6"><animate attributeName="cy" values="60;30;60" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="270" r="2"><animate attributeName="cy" values="270;240;270" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="60" r="2"><animate attributeName="cy" values="60;90;60" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shield emblem -->
  <g transform="translate(1020 110)">
    <circle r="78" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5">
      <animate attributeName="r" values="70;92;70" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="58" fill="none" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 -42 L34 -28 V6 C34 28 16 42 0 50 C-16 42 -34 28 -34 6 V-28 Z" fill="#0d1117" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M-14 4 L-4 15 L16 -10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 60;60 0;60 0" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- top status line -->
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14">
    <circle cx="64" cy="58" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="63" fill="#8b949e" letter-spacing="2">SYSTEM ONLINE  //  SECURE CHANNEL ACTIVE</text>
  </g>

  <!-- name -->
  <text x="60" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="74" font-weight="800" fill="url(#name)" letter-spacing="1">
    SARFARAZ ABBAS
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>

  <!-- typed subtitle -->
  <g clip-path="url(#typeclip)" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="22">
    <text x="62" y="205" fill="#38bdf8">&gt; Cyber Security Researcher</text>
    <text x="62" y="238" fill="#8b949e">  Ethical Hacking  ·  DevSecOps  ·  Full Stack Engineering</text>
  </g>

  <!-- blinking cursor -->
  <rect x="62" y="252" width="12" height="3" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>
</svg>
